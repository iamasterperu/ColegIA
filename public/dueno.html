<!doctype html>
<html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Panel</title>
<link rel="manifest" href="/dueno.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f172a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ColegIA Dueño">
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e5e9f2;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:18px 16px 80px}h1{font-size:1.35rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.top span{flex:1}
.card{background:#16213a;border:1px solid #26334f;border-radius:14px;padding:14px 16px;margin-bottom:12px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #33425f;background:#0f172a;color:#fff;font:inherit;margin:4px 0 10px}
label{font-size:.85rem;color:#a9b4cc}button,.b{background:#f59e0b;color:#1b2333;border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
.g{background:#26334f;color:#e5e9f2}.r{background:#7f1d1d;color:#fff}.peq{font-size:.82rem;color:#9fb0cf}.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:#26334f;font-size:.75rem;margin-left:6px}
.ok{background:#14532d}.mal{background:#7f1d1d}.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.enlace{background:#0b1222;border:1px dashed #f59e0b;border-radius:10px;padding:10px;word-break:break-all;font-size:.85rem;margin-top:8px}.msg{color:#fca5a5;margin:6px 0}
table{width:100%;border-collapse:collapse}td{padding:7px 4px;border-top:1px solid #26334f;vertical-align:middle;font-size:.88rem}
</style></head><body><main id="raiz"></main><script type="module" src="/js/dueno.js"></script></body></html>
